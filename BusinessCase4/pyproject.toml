[project]
name = "bc4-p4-ews"
version = "1.0.0"
description = "BC4 Persona 4 — Deep Learning Early Warning System"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "nbconvert>=7.9.0",
    "ipykernel>=6.26.0",
    "hmmlearn>=0.3.3",
]

[dependency-groups]
dev = [
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
]
